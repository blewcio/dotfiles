# General settings
set -g history-limit 10000

# No bells at all
set -g bell-action none

# Copy to clipboard (server option)
set -s set-clipboard on
# Fallback for terminals without OSC 52 support:
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Reduce time how long messages are displayed (in ms)
set-option -g display-time 1000

# Enable mouse control
set-option -g mouse on
# set -g mouse on
# set-window-option -g mode-mouse on

# Improve responsiveness
set -sg escape-time 1
# Start windows/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Notify about active windows
setw -g monitor-activity on
set  -g visual-activity off

# Needed for vim/neovim autoread
set -g focus-events on
# Renumber windows when one is closed
set -g renumber-windows on

# General status bar settings
set -g status on
set -g status-interval 5
set -g status-position top

# Enable image preview in Terminal with tmux (e.g. imgcat)
# Improve colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color*:Tc"
set -g allow-passthrough on

# Pass through xterm-style escape sequences for modified arrow/function keys
# (needed for e.g. Shift+Right selection bindings in shellrc.sh to reach zsh)
set-window-option -g xterm-keys on

# Key bindings

# Rebind default prefix to Ctrl-Space for convenience
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind C-s
bind 'S' source-file "~/.tmux.conf"    # Reload config file

# F12 toggles this tmux "off" so every key goes to the program in the pane, e.g. a
# remote tmux running inside it (nested tmux). F12 again switches back; the status
# bar shows KEYS OFF meanwhile. On a Mac keyboard this may need Fn+F12.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  refresh-client -S

# Vim-like key bindings
set -g mode-keys vi

# y like in vim (paste with the default Prefix+])
unbind i
bind i copy-mode
unbind C-r # Vim style choose register in I
bind C-r choose-buffer    # tmux clipboard history
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi 0 send -X start-of-line
bind-key -T copy-mode-vi $ send -X end-of-line

# Screen scrolling in copy mode
bind-key -T copy-mode-vi S-Up send-keys -X halfpage-up
bind-key -T copy-mode-vi S-Down send-keys -X halfpage-down

# Pane and window management: default keys stay (c new window, n/p next/previous
# window, x kill pane with confirmation, z zoom, o next pane, s session list),
# only the splits are custom and open in the current directory
bind v split-window -h -c "#{pane_current_path}"   # Split side by side
bind V split-window -v -c "#{pane_current_path}"   # Split stacked
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind X confirm-before -p "Kill all other panes? (y/n)" "kill-pane -a"
bind C-w choose-tree

# Moving between panes like in vim (Prefix h/j/k/l)
# C-h/C-j/C-k/C-l are NOT bound in tmux, so shells keep backspace, enter, kill-line
# and clear-screen. Inside vim/nvim the vim-tmux-navigator plugin (vim-config) moves
# between vim splits with C-h/j/k/l and hands over to tmux at the edge of the window.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Moving between windows like in vim
bind -r C-h  select-window -t :-
bind -r C-l  select-window -t :+
bind-key C-^ last-window  # Toggle between last active windows

# Shortcut to make a TODO note in the local directory
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && $EDITOR TODO.md || $EDITOR ~/TODOs.md"

# Resizing of panes
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Custom scripts and functions
# Cheat sheet
set-option -g update-environment "PATH"
bind-key -r e run-shell "tmux neww tmux-cht"
# Quick session switcher with fzf popup (Prefix+C-f)
bind-key C-f run-shell "tmux-session-switcher"
# Project sessionizer (Prefix+C-p)
bind-key C-p run-shell "tmux neww tmux-sessionizer"
# Back to the previously used session (Prefix+b), as the default Prefix+L is a resize key
bind-key b switch-client -l

#Plugins & plugin manager 
# prefix + I - Installs new plugins from GitHub or any other git repository Refreshes TMUX environment
# prefix + U - updates plugin(s)
# prefix + alt + u - remove/uninstall plugins not on the plugin list (first remove from config file)
set -g @plugin 'tmux-plugins/tpm'

# Persisting sessions even after reboots
# Prefix C-s - manually save session
# Prefix R - manually restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-restore 'R'
# Auto save sessions 
set -g @plugin 'tmux-plugins/tmux-continuum' 
# A set of tmux options that should be acceptable to everyone.
# Most settings are now defaults in tmux 3.0+, kept for older versions
# set -g @plugin 'tmux-plugins/tmux-sensible'
# Easymotion like jump on screen
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'f'
# Search tmux commands with fzf (C- T, like command bar)
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY=C-t
# Managing fzf with tmux
# Fuzzy find the text/path/url/line, use custom filters (ctrl + f)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# Complete commands that require you to retype text that is already on the screen
# Prefix+Tab to search for text on screen. Tab to paste into command.
set -g @plugin 'laktak/extrakto'

# Visual skin
# # Configure the catppuccin plugin
set -g @plugin 'catppuccin/tmux#v2.1.2' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
set -g @catppuccin_window_text "#W" # NOTE: _default_ does not work
set -g @catppuccin_window_current_text "#W"

# # Make the status line pretty and add some modules
set -ag status-right "#{prefix_highlight}"
set -ag status-right '#[fg=blue,bg=orange]#{?window_zoomed_flag, ZOOMED ,}#[fg=default,bg=default]'
set -ag status-right '#[fg=black,bg=yellow]#{?#{==:#{client_key_table},off}, KEYS OFF (F12) ,}#[fg=default,bg=default]'
set -gaF status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_1}, none]  #{pane_current_path}"
set -gaF status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none] │ "
set -agF status-right "#{@catppuccin_status_user}"
set -agF status-right "#{@catppuccin_status_host}"
# set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_uptime}"

# Initialize TMUX plugin manager (keep this line at the very bottom of
# tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
